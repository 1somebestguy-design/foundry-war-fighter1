name: Package Foundry module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build compendium pack
        run: |
          npm install --no-save @foundryvtt/foundryvtt-cli
          node --input-type=module <<'NODE'
          import { compilePack, extractPack } from "@foundryvtt/foundryvtt-cli";
          import { readdir, rm } from "node:fs/promises";
          await compilePack("packs/src/warfighter", "packs/warfighter", { log: true });
          const verifyDir = "/tmp/warfighter-pack-verify";
          await rm(verifyDir, { recursive: true, force: true });
          await extractPack("packs/warfighter", verifyDir, { log: true });
          const files = (await readdir(verifyDir)).filter(file => file.endsWith(".json"));
          if (files.length === 0) throw new Error("Compendium verification failed: no documents were compiled.");
          console.log(`Verified compendium documents: ${files.length}`);
          NODE
      - name: Package module
        run: |
          mkdir -p dist
          zip -r dist/module.zip module.json scripts/ packs/warfighter/
          cp module.json dist/module.json
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            dist/module.zip
