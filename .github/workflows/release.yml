name: Package Foundry module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check module JavaScript
        run: node --check scripts/warfighter.js
      - name: Build compendium pack
        run: |
          npm install --no-save @foundryvtt/foundryvtt-cli
          node --input-type=module <<'NODE'
          import { compilePack, extractPack } from "@foundryvtt/foundryvtt-cli";
          import { readdir, readFile, rm } from "node:fs/promises";
          await compilePack("packs/src/warfighter", "packs/warfighter", { log: true });
          const verifyDir = "/tmp/warfighter-pack-verify";
          await rm(verifyDir, { recursive: true, force: true });
          await extractPack("packs/warfighter", verifyDir, { log: true });
          const files = (await readdir(verifyDir)).filter(file => file.endsWith(".json"));
          const docs = await Promise.all(files.map(async file => JSON.parse(await readFile(`${verifyDir}/${file}`, "utf8"))));
          const byId = new Map(docs.map(doc => [doc._id, doc]));
          for (const doc of docs) {
            for (const effect of (doc.effects ?? [])) {
              const expectedKey = `!items.effects!${doc._id}.${effect._id}`;
              if (effect._key !== expectedKey) throw new Error(`Embedded effect ${effect._id} in ${doc._id} has an invalid _key.`);
            }
          }
          const subclass = byId.get("streetfighter001");
          if (!subclass) throw new Error("Compendium verification failed: subclass document is missing.");
          const advancements = subclass.system?.advancement ?? [];
          if (advancements.length !== 4) throw new Error(`Expected 4 subclass advancements, found ${advancements.length}.`);
          const expectedFeatures = ["streetfeat000001", "streetfeat000002", "streetfeat000003", "streetfeat000004", "streetfeat000005", "streetfeat000006"];
          for (const id of expectedFeatures) {
            if (!byId.has(id)) throw new Error(`Compendium verification failed: feature ${id} is missing.`);
          }
          const grantedIds = advancements.flatMap(adv => (adv.configuration?.items ?? []).map(item => item.uuid?.split(".").at(-1)));
          for (const id of expectedFeatures) {
            if (!grantedIds.includes(id)) throw new Error(`Advancement does not grant feature ${id}.`);
          }
          const techniques = byId.get("streetfeat000001");
          if (techniques.system?.uses?.max !== "@prof * 2") throw new Error("Technique points formula is missing.");
          const expectedActivities = {
            stPlexus00000001: "1",
            stLash0000000001: "1",
            stGrapple0000001: "2",
            stShove000000001: "1"
          };
          for (const [id, cost] of Object.entries(expectedActivities)) {
            const activity = techniques.system?.activities?.[id];
            if (!activity || activity.type !== "utility") throw new Error(`Technique activity ${id} is missing or invalid.`);
            if (!(activity.consumption?.targets ?? []).some(target => target.type === "itemUses" && target.target === "" && target.value === cost)) {
              throw new Error(`Technique activity ${id} does not consume the correct shared technique points.`);
            }
          }
          const childActivities = techniques.system?.activities ?? {};
          for (const [id, type] of [["stAtkPlexus00001","attack"],["stDmgPlexus0001","damage"],["stAtkLash000001","attack"],["stDmgLash000001","damage"],["stAtkShove00001","attack"],["stDmgShove00001","damage"]]) {
            if (childActivities[id]?.type !== type) throw new Error(`Required hidden roll activity ${id} is missing.`);
          }
          const hasChange = (id, key, value) => (byId.get(id)?.effects ?? [])
            .some(effect => (effect.system?.changes ?? []).some(change => change.key === key && String(change.value) === String(value)));
          if (!hasChange("streetfeat000002", "system.attributes.movement.walk", 10)) throw new Error("Automatic speed increase is missing.");
          if (!hasChange("streetfeat000002", "flags.dnd5e.powerfulBuild", true)) throw new Error("Powerful Build effect is missing.");
          if (!hasChange("streetfeat000003", "system.attributes.ac.calcs", "streetFighter")) throw new Error("Steel Muscles AC calculation is missing.");
          if (!hasChange("streetfeat000003", "system.traits.ci.value", "stunned")) throw new Error("Stunned immunity is missing.");
          if (!hasChange("streetfeat000004", "system.attributes.senses.blindsight", 15)) throw new Error("Blindsight effect is missing.");
          console.log(`Verified subclass, ${expectedFeatures.length} feature documents, four technique activities, shared resource, and passive effects.`);
          NODE
      - name: Package module
        run: |
          mkdir -p dist
          zip -r dist/module.zip module.json scripts/ packs/warfighter/
          cp module.json dist/module.json
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            dist/module.zip
