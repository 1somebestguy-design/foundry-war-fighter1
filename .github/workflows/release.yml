name: Package Foundry module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build compendium pack
        run: |
          npm install --no-save @foundryvtt/foundryvtt-cli
          node --input-type=module <<'NODE'
          import { compilePack, extractPack } from "@foundryvtt/foundryvtt-cli";
          import { readdir, readFile, rm } from "node:fs/promises";
          await compilePack("packs/src/warfighter", "packs/warfighter", { log: true });
          const verifyDir = "/tmp/warfighter-pack-verify";
          await rm(verifyDir, { recursive: true, force: true });
          await extractPack("packs/warfighter", verifyDir, { log: true });
          const files = (await readdir(verifyDir)).filter(file => file.endsWith(".json"));
          const docs = await Promise.all(files.map(async file => JSON.parse(await readFile(`${verifyDir}/${file}`, "utf8"))));
          const byId = new Map(docs.map(doc => [doc._id, doc]));
          const subclass = byId.get("streetfighter001");
          if (!subclass) throw new Error("Compendium verification failed: subclass document is missing.");
          const advancements = subclass.system?.advancement ?? [];
          if (advancements.length !== 4) throw new Error(`Expected 4 subclass advancements, found ${advancements.length}.`);
          const expectedFeatures = ["streetfeat000001", "streetfeat000002", "streetfeat000003", "streetfeat000004", "streetfeat000005", "streetfeat000006"];
          for (const id of expectedFeatures) {
            if (!byId.has(id)) throw new Error(`Compendium verification failed: feature ${id} is missing.`);
          }
          const grantedIds = advancements.flatMap(adv => (adv.configuration?.items ?? []).map(item => item.uuid?.split(".").at(-1)));
          for (const id of expectedFeatures) {
            if (!grantedIds.includes(id)) throw new Error(`Advancement does not grant feature ${id}.`);
          }
          console.log(`Verified subclass and ${expectedFeatures.length} feature documents across ${advancements.length} level advancements.`);
          NODE
      - name: Package module
        run: |
          mkdir -p dist
          zip -r dist/module.zip module.json scripts/ packs/warfighter/
          cp module.json dist/module.json
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            dist/module.zip
